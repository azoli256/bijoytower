<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভবন খতিয়ান</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EFE7D6;
    --panel:#FBF7EC;
    --panel-2:#F4EEDC;
    --ink:#20282A;
    --ink-soft:#5B655E;
    --ink-faint:#8B9089;
    --line:#D9C99A;
    --line-strong:#C4A968;
    --red:#A2382C;
    --red-soft:#F3E1D9;
    --green:#2C6B54;
    --green-soft:#DEEEE5;
    --gold:#A5762A;
    --gold-soft:#F2E4BE;
    --topbar-bg:#20282A;
    --topbar-ink:#F2EAD4;
    --shadow:0 10px 28px rgba(40,28,8,0.16);
    --font-head:'Noto Serif Bengali','Noto Serif',serif;
    --font-body:'Noto Sans Bengali',Inter,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171310; --panel:#221C15; --panel-2:#2A231A; --ink:#EFE6D2; --ink-soft:#B9AC8C; --ink-faint:#8A7E64;
      --line:#3B3325; --line-strong:#5A4C30; --red:#DB7A67; --red-soft:#3A2620; --green:#6FBB99; --green-soft:#1E332B;
      --gold:#DDAF56; --gold-soft:#3A2E15; --topbar-bg:#0F0C09; --topbar-ink:#EFE6D2; --shadow:0 10px 30px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171310; --panel:#221C15; --panel-2:#2A231A; --ink:#EFE6D2; --ink-soft:#B9AC8C; --ink-faint:#8A7E64;
    --line:#3B3325; --line-strong:#5A4C30; --red:#DB7A67; --red-soft:#3A2620; --green:#6FBB99; --green-soft:#1E332B;
    --gold:#DDAF56; --gold-soft:#3A2E15; --topbar-bg:#0F0C09; --topbar-ink:#EFE6D2; --shadow:0 10px 30px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  h1,h2,h3,.font-head{font-family:var(--font-head);text-wrap:balance;}
  button,input,select{font-family:inherit;}
  svg.icon{flex-shrink:0;}

  .loading-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);background:var(--bg);font-size:14px;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;background:
      radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--topbar-bg) 82%, var(--gold) 18%) 0%, var(--topbar-bg) 55%);}
  .login-card{width:100%;max-width:400px;background:var(--panel);border-radius:14px;padding:30px 26px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .login-brand .brand-icon{width:44px;height:44px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-title{font-weight:700;font-size:20px;line-height:1.25;}
  .brand-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .footnote{color:#C9BEA0;font-size:12px;margin-top:18px;max-width:400px;text-align:center;line-height:1.6;}

  .tab-switch{display:flex;background:var(--panel-2);border-radius:10px;padding:4px;margin-bottom:20px;border:1px solid var(--line);}
  .tab-switch.wide{max-width:520px;}
  .tab-switch button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 10px;border:none;background:transparent;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;}
  .tab-switch button.active{background:var(--topbar-bg);color:var(--topbar-ink);}
  .tab-switch.small{max-width:240px;margin-bottom:2px;}

  .login-form{display:flex;flex-direction:column;gap:15px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .field input,.field select{font-family:var(--font-body);font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .err{color:var(--red);font-size:13px;font-weight:600;}
  .notice{background:var(--gold-soft);border:1px solid var(--line-strong);color:var(--ink);padding:9px 11px;border-radius:8px;font-size:12.5px;}
  .hint{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:0;}

  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--topbar-bg);color:var(--topbar-ink);border:1px solid var(--topbar-bg);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .btn-primary:hover{opacity:0.92;}
  .btn-primary.small{padding:7px 12px;font-size:12.5px;}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line-strong);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn-ghost:hover{background:var(--panel-2);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;border-radius:6px;}
  .icon-btn:hover{background:var(--panel-2);color:var(--ink);}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .checkbox-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}

  /* ---------- App shell ---------- */
  .app-shell{min-height:100vh;background:var(--bg);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--topbar-bg);color:var(--topbar-ink);position:sticky;top:0;z-index:10;}
  .topbar-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-title{font-family:var(--font-head);font-weight:700;font-size:16.5px;white-space:nowrap;}
  .topbar-sub{font-size:11.5px;color:#BDB090;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .btn-ghost{border-color:#4a4033;color:var(--topbar-ink);flex-shrink:0;}

  .content{max-width:800px;margin:0 auto;padding:20px 16px 70px;display:flex;flex-direction:column;gap:16px;}

  .month-picker{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .month-picker input{font-family:var(--font-body);padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}

  .summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .summary-card{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .summary-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tone-green .summary-icon{background:var(--green-soft);color:var(--green);}
  .tone-red .summary-icon{background:var(--red-soft);color:var(--red);}
  .tone-gold .summary-icon{background:var(--gold-soft);color:var(--gold);}
  .summary-label{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .summary-value{font-family:var(--font-head);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}

  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px;}
  .chart-svg{width:100%;height:auto;display:block;}
  .chart-grid{stroke:var(--line);stroke-dasharray:2 3;}
  .chart-axis-label{font-size:9.5px;fill:var(--ink-faint);font-family:var(--font-body);}
  .chart-value{font-size:11px;font-weight:700;fill:var(--ink);font-family:var(--font-body);}
  .chart-cat-label{font-size:11px;font-weight:700;fill:var(--ink-soft);font-family:var(--font-body);}

  .ledger-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .ledger-card-title{font-family:var(--font-head);font-weight:600;font-size:15px;margin-bottom:10px;}
  .ledger-card-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .empty-row{color:var(--ink-soft);font-size:13px;padding:10px 2px;}

  .cat-list{display:flex;flex-direction:column;}
  .cat-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .cat-row:last-child{border-bottom:none;}
  .cat-amount{font-weight:700;font-variant-numeric:tabular-nums;}
  .cat-amount.tone-green{color:var(--green);}
  .cat-amount.tone-red{color:var(--red);}

  .ledger-table-wrap{border-left:3px solid var(--red);padding-left:12px;overflow-x:auto;}
  .table{display:flex;flex-direction:column;min-width:520px;}
  .table-head,.table-row{display:grid;grid-template-columns:58px 1.6fr 72px 100px 1.2fr 48px;gap:8px;align-items:center;padding:8px 2px;font-size:12.5px;border-bottom:1px solid var(--line);}
  .table-head{color:var(--ink-soft);font-weight:700;}
  .table-row:last-child{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .tabular{font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .pill-green{background:var(--green-soft);color:var(--green);}
  .pill-red{background:var(--red-soft);color:var(--red);}

  .ledger-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,12,9,0.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--line);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-head);font-weight:700;font-size:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}

  #toast-root{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;padding:0 14px;}
  .toast{background:var(--topbar-bg);color:var(--topbar-ink);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .25s ease, transform .25s ease;max-width:420px;text-align:center;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast-error{background:var(--red);color:#fff;}
  .toast-ok{background:var(--green);color:#fff;}

  @media (max-width:560px){
    .summary-row{grid-template-columns:1fr;}
    .table{min-width:0;}
    .table-head,.table-row{grid-template-columns:48px 1fr 56px 84px;}
    .table-head span:nth-child(5),.table-row span:nth-child(5){display:none;}
    .table-row .row-actions{display:flex;grid-column:1 / -1;justify-content:flex-end;}
    .table-row{overflow-wrap:anywhere;}
  }
</style>
</head>
<body>
<div id="app-root"><div class="loading-wrap">লোড হচ্ছে…</div></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module">
  var serverRevision = 0;
  var savedSnapshot = null;

  /* ---------------------------------------------------------
     Constants
  --------------------------------------------------------- */
  var INCOME_CATEGORIES = ["সার্ভিস চার্জ","গ্যারেজ ভাড়া (ফ্ল্যাট মালিক)","গ্যারেজ ভাড়া (বহিরাগত)","কার পার্কিং"];
  var COST_CATEGORIES = ["পানি ও বিদ্যুৎ বিল","নিরাপত্তা প্রহরীর গ্যাস রিচার্জ","ময়লা বিল"];
  var SERVICE_CHARGE_AMOUNT = 3000;
  var MONTH_NAMES = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

  /* ---------------------------------------------------------
     Helpers
  --------------------------------------------------------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function monthLabel(ym){
    if(!ym) return "";
    var parts = ym.split("-"); var y = Number(parts[0]), m = Number(parts[1]);
    return MONTH_NAMES[m-1] + " " + y;
  }
  function currentMonth(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function taka(n){
    var v = Number(n) || 0;
    return "৳" + v.toLocaleString("en-US");
  }
  function normalizePhone(s){
    return (s || "").replace(/[^\d]/g,"").slice(-11);
  }
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function niceMax(v){
    if(v <= 0) return 10;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / mag;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  /* ---------------------------------------------------------
     Icons
  --------------------------------------------------------- */
  var ICON_PATHS = {
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    phone: '<path d="M6 3h3l1.4 4.2-2 1.6a12.5 12.5 0 0 0 6.8 6.8l1.6-2 4.2 1.4v3a2 2 0 0 1-2.2 2C10.9 19.6 4.4 13.1 4 5.2A2 2 0 0 1 6 3z"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    trash: '<polyline points="4 7 20 7"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>',
    pencil: '<path d="M4 20l4-1 11-11a2 2 0 0 0-3-3L5 16z"/><line x1="14" y1="5" x2="19" y2="10"/>',
    logout: '<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><polyline points="15 16 20 12 15 8"/><line x1="20" y1="12" x2="9" y2="12"/>',
    building: '<rect x="4" y="3" width="16" height="18" rx="1.4"/><line x1="8" y1="7.2" x2="8" y2="7.21"/><line x1="12" y1="7.2" x2="12" y2="7.21"/><line x1="16" y1="7.2" x2="16" y2="7.21"/><line x1="8" y1="11.2" x2="8" y2="11.21"/><line x1="12" y1="11.2" x2="12" y2="11.21"/><line x1="16" y1="11.2" x2="16" y2="11.21"/><path d="M10 21v-4h4v4"/>',
    shield: '<path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/><polyline points="9 12 11 14 15 10"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5"/><circle cx="17.5" cy="9" r="2.3"/><path d="M15.3 14.2c2.6 0.2 4.7 1.9 4.7 4.8"/>',
    book: '<path d="M4 5.2A2.2 2.2 0 0 1 6.2 3H12v18H6.2A2.2 2.2 0 0 0 4 23.2z"/><path d="M12 3h5.8A2.2 2.2 0 0 1 20 5.2v16A2.2 2.2 0 0 0 17.8 19H12z"/>',
    arrowUpRight: '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="8 7 17 7 17 16"/>',
    arrowDownRight: '<line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 8 17 17 8 17"/>',
    x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
    check: '<polyline points="5 12 10 17 19 7"/>'
  };
  function icon(name, size){
    size = size || 16;
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICON_PATHS[name]||"")+'</svg>';
  }

  /* ---------------------------------------------------------
     Local records + ephemeral UI
  --------------------------------------------------------- */
  var STATE = null;
  var stateLoaded = false;
  var stateError = null;

  var UI = {
    session: null,
    loginMode: "admin",
    loginErr: "",
    phoneInput: "",
    month: currentMonth(),
    adminTab: "overview",
    modal: null
  };
  var draftEntry = null;
  var draftFlat = null;

  /* ---------------------------------------------------------
     Server JSON database and portable backups
  --------------------------------------------------------- */
  function emptyState(){ return {flats:[], entries:[], pin:"configured"}; }
  function validateState(data){
    if(!data || !Array.isArray(data.flats) || !Array.isArray(data.entries) ||
      !(data.pin === undefined || data.pin === null || typeof data.pin === "string")) throw new Error("ব্যাকআপের তথ্য সঠিক নয়।");
    var flatIds = new Set(), entryIds = new Set();
    data.flats.forEach(function(f){
      if(!f || typeof f.flatNo !== "string" || !f.flatNo.trim() || typeof f.ownerName !== "string" || !f.ownerName.trim() ||
        typeof f.mobile !== "string" || flatIds.has(f.flatNo)) throw new Error("ফ্ল্যাটের তথ্য সঠিক নয় বা একই নম্বর একাধিকবার আছে।");
      flatIds.add(f.flatNo);
    });
    data.entries.forEach(function(e){
      if(!e || typeof e.id !== "string" || !e.id || entryIds.has(e.id) || !["income","cost"].includes(e.type) ||
        typeof e.category !== "string" || !e.category.trim() || !Number.isFinite(e.amount) || e.amount <= 0 ||
        typeof e.month !== "string" || !/^\d{4}-(0[1-9]|1[0-2])$/.test(e.month) ||
        typeof e.flatNo !== "string" || typeof e.note !== "string") throw new Error("লেনদেনের তথ্য সঠিক নয়।");
      entryIds.add(e.id);
    });
    return {flats:data.flats.map(function(f){ return {flatNo:f.flatNo, ownerName:f.ownerName, mobile:f.mobile}; }),
      entries:data.entries.map(function(e){ return {id:e.id,type:e.type,category:e.category,amount:e.amount,month:e.month,flatNo:e.flatNo,note:e.note}; })};
  }
  function readRecords(raw){
    var record = JSON.parse(raw);
    if(!record || record.app !== "bijoytower" || record.version !== 1) throw new Error("এটি ভবন খতিয়ানের উপযুক্ত ব্যাকআপ নয়।");
    return validateState(record.data);
  }
  function encodeRecords(data){
    return JSON.stringify({app:"bijoytower",version:1,savedAt:new Date().toISOString(),data:validateState(data)}, null, 2);
  }
  async function api(body){
    var response = await fetch("/api/database", {method:body ? "POST" : "GET", credentials:"same-origin", cache:"no-store",
      headers:body ? {"Content-Type":"application/json"} : {}, body:body ? JSON.stringify(body) : undefined});
    var result;
    try { result = await response.json(); } catch(err){ throw new Error("সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি।"); }
    if(!response.ok){ var error = new Error(result.error || "সংযোগ ব্যর্থ হয়েছে।"); error.status = response.status; throw error; }
    return result;
  }
  function acceptRemote(result){
    STATE = result.state; serverRevision = result.revision; UI.session = result.session;
    savedSnapshot = JSON.stringify(STATE); stateLoaded = true; stateError = null;
  }
  async function loadRemote(){
    try { acceptRemote(await api()); } catch(err){ stateError = err.message; }
    renderApp();
  }
  async function persist(){
    if(UI.saving) return false;
    UI.saving = true;
    document.querySelectorAll("button,input,select").forEach(function(el){ el.disabled = true; });
    try {
      acceptRemote(await api({action:"save", revision:serverRevision, state:STATE}));
      showToast("ok","JSON ডাটাবেসে সংরক্ষণ করা হয়েছে।");
      return true;
    } catch(err){
      STATE = JSON.parse(savedSnapshot);
      if(err.status === 409 || err.status === 403){ try { acceptRemote(await api()); } catch(ignore){} }
      showToast("error","সংরক্ষণ হয়নি: " + err.message);
      return false;
    } finally { UI.saving = false; renderApp(); }
  }
  function downloadBackup(){
    var url = URL.createObjectURL(new Blob([encodeRecords(STATE)], {type:"application/json;charset=utf-8"}));
    var link = document.createElement("a");
    link.href = url;
    link.download = "bijoytower-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  async function restoreBackup(file){
    if(!file || UI.saving) return;
    try {
      if(file.size > 3 * 1024 * 1024) throw new Error("ব্যাকআপ ফাইলটি ৩ মেগাবাইটের বেশি।");
      var restored = readRecords(await file.text());
      if(!confirm(restored.flats.length + "টি ফ্ল্যাট ও " + restored.entries.length + "টি লেনদেন ফিরিয়ে আনবেন? বর্তমান তথ্য প্রতিস্থাপিত হবে। আগে বর্তমান ব্যাকআপ ডাউনলোড করে রাখুন।")) return;
      STATE = restored;
      if(await persist()){
        UI.modal = null;
        renderApp();
        showToast("ok","ব্যাকআপ ফিরিয়ে আনা হয়েছে। ক্যাশিয়ারের পিন অপরিবর্তিত আছে।");
      }
    } catch(err){ showToast("error", "ব্যাকআপ ফিরিয়ে আনা যায়নি: " + err.message); }
  }

  function showToast(kind, msg){

  /* ---------------------------------------------------------
     Summary computation
  --------------------------------------------------------- */
  function summarize(entries, month){
    var inMonth = entries.filter(function(e){ return e.month === month; });
    var income = inMonth.filter(function(e){ return e.type === "income"; });
    var cost = inMonth.filter(function(e){ return e.type === "cost"; });
    function sumBy(list){
      var map = {};
      list.forEach(function(e){ map[e.category] = (map[e.category]||0) + Number(e.amount); });
      return map;
    }
    var incomeTotal = income.reduce(function(s,e){ return s+Number(e.amount); },0);
    var costTotal = cost.reduce(function(s,e){ return s+Number(e.amount); },0);
    return {
      income: income, cost: cost,
      incomeByCat: sumBy(income), costByCat: sumBy(cost),
      incomeTotal: incomeTotal, costTotal: costTotal, net: incomeTotal - costTotal
    };
  }

  /* ---------------------------------------------------------
     Chart
  --------------------------------------------------------- */
  function renderChart(income, cost){
    var max = niceMax(Math.max(income, cost, 1));
    var w = 320, h = 190, padL = 62, padR = 14, padT = 14, padB = 30;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var steps = 4;
    var grid = "";
    for(var i=0;i<=steps;i++){
      var v = max*i/steps;
      var y = padT + plotH - (v/max)*plotH;
      grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" class="chart-grid"/>';
      grid += '<text x="'+(padL-8)+'" y="'+(y+4)+'" class="chart-axis-label" text-anchor="end">'+esc(taka(Math.round(v)))+'</text>';
    }
    var barW = plotW*0.28;
    var xIncome = padL + plotW*0.27 - barW/2;
    var xCost = padL + plotW*0.73 - barW/2;
    var yIncome = padT + plotH - (income/max)*plotH;
    var yCost = padT + plotH - (cost/max)*plotH;
    var hIncome = padT+plotH-yIncome, hCost = padT+plotH-yCost;
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" role="img" aria-label="আয় ও ব্যয়ের তুলনামূলক চিত্র">'+
      grid+
      '<rect x="'+xIncome+'" y="'+yIncome+'" width="'+barW+'" height="'+hIncome+'" rx="3" fill="var(--green)"/>'+
      '<text x="'+(xIncome+barW/2)+'" y="'+(yIncome-8)+'" class="chart-value" text-anchor="middle">'+esc(taka(income))+'</text>'+
      '<text x="'+(xIncome+barW/2)+'" y="'+(h-8)+'" class="chart-cat-label" text-anchor="middle">আয়</text>'+
      '<rect x="'+xCost+'" y="'+yCost+'" width="'+barW+'" height="'+hCost+'" rx="3" fill="var(--red)"/>'+
      '<text x="'+(xCost+barW/2)+'" y="'+(yCost-8)+'" class="chart-value" text-anchor="middle">'+esc(taka(cost))+'</text>'+
      '<text x="'+(xCost+barW/2)+'" y="'+(h-8)+'" class="chart-cat-label" text-anchor="middle">ব্যয়</text>'+
      '</svg>';
  }

      '<div class="modal-head"><span>'+(isNew?"নতুন ফ্ল্যাট":"ফ্ল্যাট সম্পাদনা")+'</span>'+
        '<button type="button" class="icon-btn" data-action="close-modal">'+icon("x",18)+'</button></div>'+
      '<label class="field">ফ্ল্যাট নং<input id="flat-no" '+(isNew?"":"disabled")+' value="'+esc(d.flatNo)+'" placeholder="যেমন: A-3"></label>'+
      '<label class="field">মালিকের নাম<input id="flat-owner" value="'+esc(d.ownerName)+'"></label>'+
      '<label class="field">মোবাইল নম্বর<input id="flat-mobile" value="'+esc(d.mobile)+'" placeholder="01XXXXXXXXX"></label>'+
      '<div class="modal-actions">'+
        '<button type="button" class="btn-ghost" data-action="close-modal">বাতিল</button>'+
        '<button type="button" class="btn-primary" data-action="save-flat">'+icon("check",16)+' সংরক্ষণ করুন</button>'+
      '</div></form></div>';
  }

  /* ---------------------------------------------------------
     Render orchestration
  --------------------------------------------------------- */
  function renderApp(){
    var root = document.getElementById("app-root");
    if(stateError){
      root.innerHTML = '<div class="loading-wrap" style="flex-direction:column;gap:16px;padding:20px"><span>ডাটা লোড করা যায়নি: '+esc(stateError)+'</span><button class="btn-primary" id="retry-load">আবার চেষ্টা করুন</button></div>';
      document.getElementById('retry-load').addEventListener('click', loadRemote);
      return;
    }
    if(!stateLoaded){
      root.innerHTML = '<div class="loading-wrap">লোড হচ্ছে…</div>';
      return;
    }
    if(!UI.session){
      root.innerHTML = renderLogin();
      wireLoginEvents();
    } else if(UI.session.role === "admin"){
      root.innerHTML = renderAdmin();
      wireCommonEvents();
      wireAdminEvents();
    } else {
      root.innerHTML = renderResident();
      wireCommonEvents();
    }
    renderModal();
  }

  function renderModal(){
    var root = document.getElementById("modal-root");
    if(!UI.modal){ root.innerHTML = ""; return; }
    if(UI.modal.type === "entry"){
      root.innerHTML = renderEntryModal();
      wireEntryModalEvents();
    } else if(UI.modal.type === "flat"){
      root.innerHTML = renderFlatModal();
      wireFlatModalEvents();
    }
  }

  /* ---------------------------------------------------------
     Event wiring
  --------------------------------------------------------- */
  function wireLoginEvents(){
    wireLocalTools();
    var root = document.getElementById("app-root");
    root.querySelectorAll('[data-action="set-login-mode"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        UI.loginMode = btn.dataset.mode;
        UI.loginErr = "";
        renderApp();
      });
    });
    var residentForm = document.getElementById("resident-login-form");
    if(residentForm){
      residentForm.addEventListener("submit", async function(e){
        e.preventDefault();
        var val = document.getElementById("phone-input").value;
        UI.phoneInput = val;
        var submit = residentForm.querySelector('button[type="submit"]'); submit.disabled = true;
        try { acceptRemote(await api({action:"login", role:"resident", phone:val})); UI.loginErr = ""; }
        catch(err){ UI.loginErr = err.message; }
        UI.month = currentMonth();
        renderApp();
      });
    }
    var adminForm = document.getElementById("admin-login-form");
    if(adminForm){
      adminForm.addEventListener("submit", async function(e){
        e.preventDefault();
        var pin = document.getElementById("pin-input").value;
        var submit = adminForm.querySelector('button[type="submit"]'); submit.disabled = true;
        try { acceptRemote(await api({action:"login", role:"admin", pin:pin})); UI.loginErr = ""; UI.month = currentMonth(); }
        catch(err){ UI.loginErr = err.message; }
        renderApp();
      });
    }
  }

  function wireCommonEvents(){
    var root = document.getElementById("app-root");
    var logoutBtn = root.querySelector('[data-action="logout"]');
    if(logoutBtn){
      logoutBtn.addEventListener("click", async function(){
        try { acceptRemote(await api({action:"logout"})); } catch(err){ showToast("error", err.message); return; }
        UI.session = null;
        UI.loginErr = "";
        UI.phoneInput = "";
        renderApp();
      });
    }
    var monthInput = document.getElementById("month-input");
    if(monthInput){
      monthInput.addEventListener("change", function(){
        UI.month = monthInput.value || currentMonth();
        renderApp();
      });
    }
  }

  function wireAdminEvents(){
    wireLocalTools();
    var root = document.getElementById("app-root");
    root.querySelectorAll('[data-action="set-admin-tab"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        UI.adminTab = btn.dataset.tab;
        renderApp();
      });
    });
    var newEntryBtn = root.querySelector('[data-action="new-entry"]');
    if(newEntryBtn) newEntryBtn.addEventListener("click", function(){ openEntryModal(null); });

    var bulkBtn = root.querySelector('[data-action="bulk-service-charge"]');
    if(bulkBtn) bulkBtn.addEventListener("click", bulkServiceCharge);

    root.querySelectorAll('[data-action="edit-entry"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var entry = STATE.entries.find(function(e){ return e.id === btn.dataset.id; });
        if(entry) openEntryModal(entry);
      });
    });
    root.querySelectorAll('[data-action="delete-entry"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        deleteEntry(btn.dataset.id);
      });
    });

    var newFlatBtn = root.querySelector('[data-action="new-flat"]');
    if(newFlatBtn) newFlatBtn.addEventListener("click", function(){ openFlatModal(null); });
    root.querySelectorAll('[data-action="edit-flat"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var flat = STATE.flats.find(function(f){ return f.flatNo === btn.dataset.id; });
        if(flat) openFlatModal(flat);
      });
    });
    root.querySelectorAll('[data-action="delete-flat"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        deleteFlat(btn.dataset.id);
      });
    });
  }

  function wireEntryModalEvents(){
    var root = document.getElementById("modal-root");
    root.querySelectorAll('[data-action="close-modal"],[data-action="close-modal-backdrop"]').forEach(function(el){
      el.addEventListener("click", function(e){
        if(el.dataset.action === "close-modal-backdrop" && e.target !== el) return;
        UI.modal = null; draftEntry = null; renderModal();
      });
    });
    root.querySelectorAll('[data-action="entry-type"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        draftEntry.type = btn.dataset.type;
        var presetList = draftEntry.type === "income" ? INCOME_CATEGORIES : COST_CATEGORIES;
        if(!draftEntry.useCustom) draftEntry.category = presetList[0];
        syncEntryDraftFromDom();
        renderModal();
      });
    });
    var useCustomBox = document.getElementById("entry-use-custom");
    if(useCustomBox){
      useCustomBox.addEventListener("change", function(){
        syncEntryDraftFromDom();
        draftEntry.useCustom = useCustomBox.checked;
        renderModal();
      });
    }
    var saveBtn = root.querySelector('[data-action="save-entry"]');
    if(saveBtn) saveBtn.addEventListener("click", function(){
      syncEntryDraftFromDom();
      saveEntry();
    });
  }

  function syncEntryDraftFromDom(){
    var catEl = document.getElementById("entry-category");
    var customEl = document.getElementById("entry-custom-category");
    var amountEl = document.getElementById("entry-amount");
    var monthEl = document.getElementById("entry-month");
    var flatEl = document.getElementById("entry-flatno");
    var noteEl = document.getElementById("entry-note");
    if(catEl) draftEntry.category = catEl.value;
    if(customEl) draftEntry.customCategory = customEl.value;
    if(amountEl) draftEntry.amount = amountEl.value;
    if(monthEl) draftEntry.month = monthEl.value;
    if(flatEl) draftEntry.flatNo = flatEl.value;
    if(noteEl) draftEntry.note = noteEl.value;
  }

  function wireFlatModalEvents(){
    var root = document.getElementById("modal-root");
    root.querySelectorAll('[data-action="close-modal"],[data-action="close-modal-backdrop"]').forEach(function(el){
      el.addEventListener("click", function(e){
        if(el.dataset.action === "close-modal-backdrop" && e.target !== el) return;
        UI.modal = null; draftFlat = null; renderModal();
      });
    });
    var saveBtn = root.querySelector('[data-action="save-flat"]');
    if(saveBtn) saveBtn.addEventListener("click", saveFlat);
  }

  /* ---------------------------------------------------------
     Mutations
  --------------------------------------------------------- */
  function openEntryModal(entry){
    var allCats = INCOME_CATEGORIES.concat(COST_CATEGORIES);
    draftEntry = entry ? {
      id: entry.id, type: entry.type,
      category: allCats.indexOf(entry.category) !== -1 ? entry.category : (entry.type==="income"?INCOME_CATEGORIES[0]:COST_CATEGORIES[0]),
      customCategory: allCats.indexOf(entry.category) === -1 ? entry.category : "",
      useCustom: allCats.indexOf(entry.category) === -1,
      amount: entry.amount, month: entry.month, flatNo: entry.flatNo || "", note: entry.note || ""
    } : {
      id: null, type: "income", category: INCOME_CATEGORIES[0], customCategory: "", useCustom: false,
      amount: "", month: UI.month, flatNo: "", note: ""
    };
    UI.modal = {type:"entry"};
    renderModal();
  }
  function saveEntry(){
    var d = draftEntry;
    var finalCategory = d.useCustom ? (d.customCategory||"").trim() : d.category;
    var amt = Number(d.amount);
    if(!finalCategory || !Number.isFinite(amt) || amt <= 0){
      showToast("error","খাত ও সঠিক পরিমাণ দিন।");
      return;
    }
    var entry = {
      id: d.id || uid(), type: d.type, category: finalCategory, amount: amt,
      month: d.month || currentMonth(), flatNo: d.flatNo || "", note: d.note || ""
    };
    var idx = STATE.entries.findIndex(function(e){ return e.id === entry.id; });
    if(idx >= 0) STATE.entries[idx] = entry; else STATE.entries.push(entry);
    UI.modal = null; draftEntry = null;
    renderApp();
    persist();
  }
  function deleteEntry(id){
    if(!confirm("এই লেনদেনটি মুছে ফেলবেন?")) return;
    STATE.entries = STATE.entries.filter(function(e){ return e.id !== id; });
    renderApp();
    persist();
  }
  function bulkServiceCharge(){
    var existingFlats = {};
    STATE.entries.forEach(function(e){
      if(e.type==="income" && e.category==="সার্ভিস চার্জ" && e.month===UI.month) existingFlats[e.flatNo]=true;
    });
    var additions = STATE.flats.filter(function(f){ return !existingFlats[f.flatNo]; }).map(function(f){
      return {id: uid(), type:"income", category:"সার্ভিস চার্জ", amount: SERVICE_CHARGE_AMOUNT, month: UI.month, flatNo: f.flatNo, note:"স্বয়ংক্রিয়ভাবে যোগ করা"};
    });
    if(additions.length === 0){ showToast("ok","সব ফ্ল্যাটের সার্ভিস চার্জ ইতিমধ্যে যোগ করা আছে।"); return; }
    STATE.entries = STATE.entries.concat(additions);
    renderApp();
    persist();
  }

  function openFlatModal(flat){
    draftFlat = flat ? {flatNo: flat.flatNo, ownerName: flat.ownerName, mobile: flat.mobile, _isNew:false, _origFlatNo: flat.flatNo}
                      : {flatNo:"", ownerName:"", mobile:"", _isNew:true};
    UI.modal = {type:"flat"};
    renderModal();
  }
  function saveFlat(){
    var flatNoEl = document.getElementById("flat-no");
    var ownerEl = document.getElementById("flat-owner");
    var mobileEl = document.getElementById("flat-mobile");
    var flatNo = flatNoEl.value.trim();
    var ownerName = ownerEl.value.trim();
    var mobile = mobileEl.value.trim();
    if(!flatNo || !ownerName){ showToast("error","ফ্ল্যাট নং ও মালিকের নাম দিন।"); return; }
    if(draftFlat._isNew){
      if(STATE.flats.some(function(f){ return f.flatNo === flatNo; })){
        showToast("error","এই ফ্ল্যাট নম্বর ইতিমধ্যে আছে।"); return;
      }
      STATE.flats.push({flatNo:flatNo, ownerName:ownerName, mobile:mobile});
    } else {
      STATE.flats = STATE.flats.map(function(f){
        return f.flatNo === draftFlat._origFlatNo ? {flatNo:flatNo, ownerName:ownerName, mobile:mobile} : f;
      });
    }
    STATE.flats.sort(function(a,b){ return a.flatNo.localeCompare(b.flatNo,"bn"); });
    UI.modal = null; draftFlat = null;
    renderApp();
    persist();
  }
  function deleteFlat(flatNo){
    if(!confirm("এই ফ্ল্যাটটি মুছে ফেলবেন? আগের লেনদেন খতিয়ানে থাকবে।")) return;
    STATE.flats = STATE.flats.filter(function(f){ return f.flatNo !== flatNo; });
    renderApp();
    persist();
  }

  loadRemote();
  setInterval(async function(){
    if(!UI.session || UI.saving || UI.modal || document.hidden) return;
    try { var result = await api(); if(UI.saving || UI.modal) return; if(result.revision !== serverRevision || !result.session){ acceptRemote(result); renderApp(); } } catch(ignore){}
  }, 30000);
</script>
</body>
</html>
